[project]
site_name = "Mvx.ApiClient.Net"
site_description = "A .NET wrapper around the public MultiversX API."
site_author = "Adis Dizdarevic"
site_url = "https://adis-dizdarevic.github.io/Mvx.ApiClient.Net/"
docs_dir = "."
site_dir = "site"
repo_url = "https://github.com/adis-dizdarevic/Mvx.ApiClient.Net"
repo_name = "GitHub"
copyright = """
Copyright &copy; 2026 Adis Dizdarevic
"""

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Query Options" = "query-options.md" },
  { "Error Handling" = "error-handling.md" },
  { "Clients" = "clients.md" },
  { "Endpoint Readiness" = "endpoint-readiness.md" },
  { "Release Checklist" = "release-checklist.md" },
  { "Contributing" = "contributing.md" }
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight"
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
