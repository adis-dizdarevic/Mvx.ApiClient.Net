name: Feature request
description: Suggest an endpoint group, API improvement, or package enhancement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build or improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the library add or change?
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream API endpoint
      placeholder: "https://api.multiversx.com/..."
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
