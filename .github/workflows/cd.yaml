name: Deployment

on:
  workflow_dispatch:
    inputs:
      createGitTag:
        description: Create Git Tag?
        type: boolean
        default: false
      packNuget:
        description: Nuget Pack?
        type: boolean
        default: false
      publishNuget:
        description: Nuget Publish?
        type: boolean
        default: false
      createGitHubRelease:
        description: Create GitHub Release?
        type: boolean
        default: false

jobs:
  PublishToNuGet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: 6.x

      - name: Determine assembly version
        id: version
        uses: gittools/actions/gitversion/execute@v3.0.0

      - name: Create Git Tag
        if: ${{ inputs.createGitTag }}
        run: |
          git tag -a "v${{ steps.version.outputs.fullSemVer }}" -m "Release v${{ steps.version.outputs.fullSemVer }}"
          git push origin "v${{ steps.version.outputs.fullSemVer }}"

      - name: Set assembly version
        uses: gittools/actions/gitversion/execute@v3.0.0
        with:
          updateAssemblyInfo: true

      - name: Install dependencies
        run: dotnet restore Mvx.ApiClient.Net.slnx

      - name: Build solution
        run: dotnet build Mvx.ApiClient.Net.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Mvx.ApiClient.Net.slnx --configuration Release --no-build

      - name: Pack NuGet package
        if: ${{ inputs.packNuget || inputs.publishNuget }}
        run: dotnet pack src/Mvx.ApiClient.Net/Mvx.ApiClient.Net.csproj --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.fullSemVer }}

      - name: Validate package contents
        if: ${{ inputs.packNuget || inputs.publishNuget }}
        shell: pwsh
        run: |
          $package = Get-ChildItem src/Mvx.ApiClient.Net/bin/Release/Mvx.ApiClient.Net.*.nupkg | Select-Object -First 1
          $symbols = Get-ChildItem src/Mvx.ApiClient.Net/bin/Release/Mvx.ApiClient.Net.*.snupkg | Select-Object -First 1
          if (-not $package) { throw "NuGet package was not created." }
          if (-not $symbols) { throw "Symbol package was not created." }

          $extractPath = Join-Path $env:RUNNER_TEMP "mvx-package"
          Expand-Archive -Path $package.FullName -DestinationPath $extractPath -Force

          foreach ($path in @(
            "README.md",
            "lib/net8.0/Mvx.ApiClient.Net.dll",
            "lib/net8.0/Mvx.ApiClient.Net.xml",
            "lib/net10.0/Mvx.ApiClient.Net.dll",
            "lib/net10.0/Mvx.ApiClient.Net.xml"
          )) {
            $fullPath = Join-Path $extractPath $path
            if (-not (Test-Path $fullPath)) { throw "Package is missing $path." }
          }

      - name: Publish to NuGet
        if: ${{ inputs.publishNuget }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "src/Mvx.ApiClient.Net/bin/Release/*.nupkg" \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: actions/create-release@v1
        if: ${{ inputs.createGitHubRelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_name: Release v${{ steps.version.outputs.fullSemVer }}
          tag_name: v${{ steps.version.outputs.fullSemVer }}
          body: Release of version ${{ steps.version.outputs.fullSemVer }}
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/heads/releases/') }}
