name: CI Build

on:
  workflow_dispatch:

  pull_request:
    paths:
      - src/**
      - tests/**
      - .github/**
      - docs/**
      - eng/**
      - Directory.Build.props
      - Directory.Packages.props
      - GitVersion.yml
      - .editorconfig
      - global.json
      - README.md
      - CHANGELOG.md
      - 'packages.lock.json'
      - '*.slnx'

  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .github/**
      - docs/**
      - eng/**
      - Directory.Build.props
      - Directory.Packages.props
      - GitVersion.yml
      - .editorconfig
      - global.json
      - README.md
      - CHANGELOG.md
      - 'packages.lock.json'
      - '*.slnx'

jobs:
  BuildAndTest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: dotnet restore Mvx.ApiClient.Net.slnx --locked-mode

      - name: Build solution
        run: dotnet build Mvx.ApiClient.Net.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Mvx.ApiClient.Net.slnx --configuration Release --no-build

      - name: Validate NuGet package
        run: dotnet pack src/Mvx.ApiClient.Net/Mvx.ApiClient.Net.csproj --configuration Release --no-build

      - name: Validate package contents
        shell: pwsh
        run: |
          $package = Get-ChildItem src/Mvx.ApiClient.Net/bin/Release/Mvx.ApiClient.Net.*.nupkg | Select-Object -First 1
          $symbols = Get-ChildItem src/Mvx.ApiClient.Net/bin/Release/Mvx.ApiClient.Net.*.snupkg | Select-Object -First 1
          if (-not $package) { throw "NuGet package was not created." }
          if (-not $symbols) { throw "Symbol package was not created." }

          $extractPath = Join-Path $env:RUNNER_TEMP "mvx-package"
          Expand-Archive -Path $package.FullName -DestinationPath $extractPath -Force

          foreach ($path in @(
            "README.md",
            "lib/net8.0/Mvx.ApiClient.Net.dll",
            "lib/net8.0/Mvx.ApiClient.Net.xml",
            "lib/net10.0/Mvx.ApiClient.Net.dll",
            "lib/net10.0/Mvx.ApiClient.Net.xml"
          )) {
            $fullPath = Join-Path $extractPath $path
            if (-not (Test-Path $fullPath)) { throw "Package is missing $path." }
          }

      - name: Smoke test NuGet package consumption
        shell: pwsh
        run: |
          ./eng/package-smoke-test.ps1 -TargetFramework net8.0
          ./eng/package-smoke-test.ps1 -TargetFramework net10.0
