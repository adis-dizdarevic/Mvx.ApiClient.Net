name: CI Build

on:
  workflow_dispatch:

  pull_request:
    paths:
      - src/**
      - tests/**
      - .github/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - '*.slnx'

  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .github/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - '*.slnx'

jobs:
  BuildAndTest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: dotnet restore Mvx.ApiClient.Net.slnx

      - name: Build solution
        run: dotnet build Mvx.ApiClient.Net.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Mvx.ApiClient.Net.slnx --configuration Release --no-build

      - name: Validate NuGet package
        run: dotnet pack src/Mvx.ApiClient.Net/Mvx.ApiClient.Net.csproj --configuration Release --no-build
